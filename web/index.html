<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独角兽之王 · 存档与 MOD 编辑器</title><link rel="stylesheet" href="./style.css"></head>
<body><header><strong>独角兽之王</strong><div class="header-settings"><label>目标游戏版本<select id="target"><option value="asia">亚洲中文版 v1.0.5</option><option value="western">欧美版 v1.0.5</option></select></label><label>编辑器语言<select id="language" aria-label="编辑器语言" data-no-translate><option value="zh-CN">简体中文</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select></label></div></header>
<div class="workspace-bar"><div class="tabs"><button id="show-save">存档编辑</button><button id="show-mod" class="active">MOD 制作</button></div><span>本地处理 · 不上传游戏文件</span></div>
<main><section id="save-workspace" hidden></section><section id="mod-workspace"><aside><nav id="categories" aria-label="MOD 分类"></nav></aside><div class="content"><div id="module-tabs" class="tabs sub-tabs"></div><div id="module-panel"></div><div id="mission-host" hidden></div></div></section></main>
<footer id="mod-toolbar"><div><strong>MOD 工程</strong><span id="selection-count" class="badge">0 个模块已启用</span><span id="status" role="status">正在加载本地目录…</span></div><div class="actions"><button id="reset">重置工程</button><button id="import-project">载入工程</button><button id="save-project">保存工程</button><button id="export" class="primary">导出 MOD 包</button></div></footer><script type="module" src="./app.js"></script></body></html>
