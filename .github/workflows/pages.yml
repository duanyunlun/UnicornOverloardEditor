name: 发布浏览器编辑器
on:
  push:
    branches: [main]
    paths: ['web/**', 'docs/第三方MOD来源.md', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/mission/package-lock.json
      - run: npm ci --prefix web/mission
      - run: npm test --prefix web
      - run: npm run build --prefix web/mission
      - run: npm run build --prefix web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
