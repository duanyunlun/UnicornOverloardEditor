name: 手动发布 Web 静态包

run-name: 发布 Web ${{ inputs.version }}（${{ github.ref_name }}）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号，例如 0.16 或 0.16.1
        required: true
        type: string
      prerelease:
        description: 标记为预发布版本
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Web 静态包
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: 校验版本号与远端状态
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "版本号必须为 0.16 或 0.16.1 形式。" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1 || gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag 或 Release 已存在。" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/mission/package-lock.json
      - run: npm ci --prefix web/mission
      - run: npm test --prefix web
      - run: npm run build --prefix web/mission
      - run: npm run build --prefix web
      - name: 打包并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/UnicornOverloardEditor-$RELEASE_VERSION-web.zip"
          (cd web/dist && zip -qr "$archive" .)
          unzip -tq "$archive"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo '## Web 版'
            echo '[打开编辑器](https://duanyunlun.github.io/UnicornOverloardEditor/)'
            echo
            echo '此版本只提供 Web 静态包，不再提供桌面 App。解压后使用静态 HTTP 服务打开 index.html，不支持直接双击 file:// 打开。'
            echo '源存档和游戏文件仅在浏览器内存中处理，关闭前请下载修改副本或工程。'
            echo
            echo "构建提交：$GITHUB_SHA"
            echo '## SHA-256'
            sha256sum "$archive" | sed "s#$RUNNER_TEMP/##"
          } > "$notes"
          args=("$RELEASE_VERSION" "$archive" --target "$GITHUB_SHA" --title "UnicornOverloardEditor Web $RELEASE_VERSION" --notes-file "$notes")
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); else args+=(--latest); fi
          gh release create "${args[@]}"
